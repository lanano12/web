<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotating Football Stadium: Lee vs Jack</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #87CEEB; /* Sky blue */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        .stadium-container {
            perspective: 1000px;
            width: 800px;
            height: 600px;
        }
        .stadium {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            /* Hide legacy 2D scene when WebGL is active */
            display: none;
        }
        @keyframes rotateStadium {
            from { transform: rotateY(0deg); }
            to { transform: rotateY(360deg); }
        }
        .field {
            width: 600px;
            height: 400px;
            background: linear-gradient(to bottom, #228B22 0%, #32CD32 50%, #228B22 100%);
            border: 5px solid #8B4513; /* Brown for stadium walls */
            position: absolute;
            top: 100px;
            left: 100px;
            border-radius: 10px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }
        .stands {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100px;
            background: repeating-linear-gradient(
                90deg,
                #FFD700,
                #FFD700 20px,
                #FF4500 20px,
                #FF4500 40px
            );
        }
        .stands-bottom {
            bottom: 0;
            top: auto;
            background: repeating-linear-gradient(
                90deg,
                #FF69B4,
                #FF69B4 20px,
                #DC143C 20px,
                #DC143C 40px
            );
        }
        .goalpost-left, .goalpost-right {
            position: absolute;
            top: 150px;
            width: 10px;
            height: 100px;
            background: white;
            border: 2px solid #000;
        }
        .goalpost-left {
            left: 80px;
        }
        .goalpost-right {
            right: 80px;
        }
        .crossbar {
            position: absolute;
            top: 200px;
            left: 70px;
            width: 460px;
            height: 5px;
            background: white;
            border: 2px solid #000;
        }
        /* Lee - Simplified drawing */
        .Lee {
            position: absolute;
            top: 200px;
            left: 300px;
            width: 50px;
            height: 80px;
            animation: wrestleLee 2s infinite alternate;
            z-index: 10;
        }
        .Lee-body {
            width: 30px;
            height: 50px;
            background: #00BFFF;
            position: absolute;
            top: 20px;
            left: 10px;
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
        }
        .Lee-head {
            width: 25px;
            height: 25px;
            background: #F5DEB3;
            position: absolute;
            top: 0;
            left: 12.5px;
            border-radius: 50%;
            border: 2px solid #000;
        }
        .Lee-helmet {
            width: 20px;
            height: 15px;
            background: #4B0082;
            position: absolute;
            top: 5px;
            left: 15px;
            border-radius: 50%;
        }
        .Lee-arm-left, .Lee-arm-right {
            width: 15px;
            height: 30px;
            background: #00BFFF;
            position: absolute;
        }
        .Lee-arm-left {
            top: 25px;
            left: -10px;
            transform: rotate(-45deg);
        }
        .Lee-arm-right {
            top: 25px;
            right: -10px;
            transform: rotate(45deg);
        }
        .Lee-leg-left, .Lee-leg-right {
            width: 10px;
            height: 30px;
            background: #00BFFF;
            position: absolute;
            top: 60px;
        }
        .Lee-leg-left {
            left: 10px;
        }
        .Lee-leg-right {
            right: 10px;
        }
        @keyframes wrestleLee {
            0% { transform: translateX(0) rotate(0deg); }
            100% { transform: translateX(20px) rotate(10deg); }
        }
        /* Jack - Simplified drawing */
        .Jack {
            position: absolute;
            top: 220px;
            left: 350px;
            width: 50px;
            height: 80px;
            animation: wrestleJack 2s infinite alternate reverse;
            z-index: 10;
        }
        .Jack-body {
            width: 30px;
            height: 50px;
            background: #FFD700;
            position: absolute;
            top: 20px;
            left: 10px;
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            border: 2px solid #8B4513;
        }
        .Jack-head {
            width: 25px;
            height: 25px;
            background: #F5DEB3;
            position: absolute;
            top: 0;
            left: 12.5px;
            border-radius: 50%;
            border: 2px solid #000;
        }
        .Jack-hat {
            width: 20px;
            height: 20px;
            background: #FFD700;
            position: absolute;
            top: -5px;
            left: 15px;
            border-radius: 50% 50% 0 0;
            border: 2px solid #8B4513;
        }
        .Jack-arm-left, .Jack-arm-right {
            width: 15px;
            height: 30px;
            background: #F5DEB3;
            position: absolute;
        }
        .Jack-arm-left {
            top: 25px;
            left: -10px;
            transform: rotate(45deg);
        }
        .Jack-arm-right {
            top: 25px;
            right: -10px;
            transform: rotate(-45deg);
        }
        .Jack-leg-left, .Jack-leg-right {
            width: 10px;
            height: 30px;
            background: #000080;
            position: absolute;
            top: 60px;
        }
        .Jack-leg-left {
            left: 10px;
        }
        .Jack-leg-right {
            right: 10px;
        }
        @keyframes wrestleJack {
            0% { transform: translateX(0) rotate(0deg); }
            100% { transform: translateX(-20px) rotate(-10deg); }
        }
        .title {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 24px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            z-index: 20;
        }
        /* UI panel removed as characters are now 3D geometry */
    </style>
</head>
<body>
    <div class="title">Lee vs Jack: Playing Football</div>
    
    <div class="stadium-container">
        <div class="stadium">
            <div class="stands"></div>
            <div class="field">
                <div class="goalpost-left"></div>
                <div class="goalpost-right"></div>
                <div class="crossbar"></div>
                <div class="Lee">
                    <div class="Lee-head">
                        <div class="Lee-helmet"></div>
                    </div>
                    <div class="Lee-body"></div>
                    <div class="Lee-arm-left"></div>
                    <div class="Lee-arm-right"></div>
                    <div class="Lee-leg-left"></div>
                    <div class="Lee-leg-right"></div>
                </div>
                <div class="Jack">
                    <div class="Jack-head">
                        <div class="Jack-hat"></div>
                    </div>
                    <div class="Jack-body"></div>
                    <div class="Jack-arm-left"></div>
                    <div class="Jack-arm-right"></div>
                    <div class="Jack-leg-left"></div>
                    <div class="Jack-leg-right"></div>
                </div>
            </div>
            <div class="stands-bottom"></div>
        </div>
    </div>
    <script src="https://unpkg.com/three@0.147.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
    <script>

        const container = document.querySelector('.stadium-container');

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.shadowMap.enabled = true;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.setClearColor(0x87CEEB, 1);
        container.appendChild(renderer.domElement);

        const scene = new THREE.Scene();

        // Camera and controls
        const camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 2000);
        camera.position.set(0, 120, 260);
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 10, 0);
        controls.enableDamping = true;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.0;

        // Lights
        scene.add(new THREE.AmbientLight(0xffffff, 0.35));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
        dirLight.position.set(120, 180, 90);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.set(2048, 2048);
        dirLight.shadow.camera.left = -300;
        dirLight.shadow.camera.right = 300;
        dirLight.shadow.camera.top = 300;
        dirLight.shadow.camera.bottom = -300;
        scene.add(dirLight);

        // Helpers (toggleable)
        // const helper = new THREE.DirectionalLightHelper(dirLight, 10);
        // scene.add(helper);

        // Field texture (procedural grass stripes + pitch lines)
        function createFieldTexture() {
            const size = 1024;
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size * 0.65; // aspect like 105m x 68m
            const ctx = canvas.getContext('2d');

            // Grass stripes
            const stripes = 14;
            for (let i = 0; i < stripes; i++) {
                ctx.fillStyle = i % 2 === 0 ? '#1e8f22' : '#2dbb2d';
                const y = (i / stripes) * canvas.height;
                const h = canvas.height / stripes;
                ctx.fillRect(0, y, canvas.width, h);
            }

            // Pitch lines
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = Math.max(2, canvas.height * 0.004);
            ctx.lineCap = 'round';

            const marginX = canvas.width * 0.04;
            const marginY = canvas.height * 0.04;
            const w = canvas.width - marginX * 2;
            const h = canvas.height - marginY * 2;

            // Outer boundary
            ctx.strokeRect(marginX, marginY, w, h);

            // Halfway line
            ctx.beginPath();
            ctx.moveTo(marginX, marginY + h / 2);
            ctx.lineTo(marginX + w, marginY + h / 2);
            ctx.stroke();

            // Center circle
            ctx.beginPath();
            ctx.arc(marginX + w / 2, marginY + h / 2, h * 0.12, 0, Math.PI * 2);
            ctx.stroke();

            // Penalty boxes (simplified)
            const boxW = w * 0.18;
            const boxH = h * 0.38;
            ctx.strokeRect(marginX, marginY + (h - boxH) / 2, boxW, boxH);
            ctx.strokeRect(marginX + w - boxW, marginY + (h - boxH) / 2, boxW, boxH);

            // Penalty arcs
            ctx.beginPath();
            ctx.arc(marginX + boxW, marginY + h / 2, h * 0.09, Math.PI * 1.5, Math.PI * 0.5);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(marginX + w - boxW, marginY + h / 2, h * 0.09, Math.PI * 0.5, Math.PI * 1.5);
            ctx.stroke();

            const tex = new THREE.CanvasTexture(canvas);
            tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
            tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
            tex.colorSpace = THREE.SRGBColorSpace;
            return tex;
        }

        // Crowd texture (procedural dots)
        function createCrowdTexture() {
            const w = 1024, h = 512;
            const canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#222';
            ctx.fillRect(0, 0, w, h);
            const rows = 70;
            const cols = 200;
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const x = (c + (r % 2) * 0.5) * (w / cols);
                    const y = r * (h / rows);
                    const hue = (Math.sin(c * 0.3 + r * 0.5) * 180 + 180) % 360;
                    const sat = 30 + Math.random() * 50;
                    const light = 35 + Math.random() * 40;
                    ctx.fillStyle = `hsl(${hue}, ${sat}%, ${light}%)`;
                    ctx.beginPath();
                    ctx.arc(x, y, 2, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.ClampToEdgeWrapping;
            tex.repeat.set(4, 1);
            tex.colorSpace = THREE.SRGBColorSpace;
            return tex;
        }

        // Build field
        const fieldTexture = createFieldTexture();
        const fieldMaterial = new THREE.MeshStandardMaterial({ map: fieldTexture, roughness: 1, metalness: 0 });
        const fieldWidth = 210; // scale for camera
        const fieldHeight = fieldWidth * 0.68; // proportion 105x68
        const field = new THREE.Mesh(new THREE.PlaneGeometry(fieldWidth, fieldHeight), fieldMaterial);
        field.rotation.x = -Math.PI / 2;
        field.receiveShadow = true;
        scene.add(field);

        // Stadium bowl (inward facing)
        const crowdTexture = createCrowdTexture();
        const bowlGeom = new THREE.CylinderGeometry(fieldWidth * 1.2, fieldWidth * 1.5, 120, 64, 8, true);
        const bowlMat = new THREE.MeshStandardMaterial({ map: crowdTexture, side: THREE.BackSide, roughness: 0.9, metalness: 0.0 });
        const bowl = new THREE.Mesh(bowlGeom, bowlMat);
        bowl.position.y = 60;
        bowl.receiveShadow = true;
        scene.add(bowl);

        // Simple goal posts
        function createGoal(z) {
            const group = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 0.1, roughness: 0.8 });
            const post = new THREE.BoxGeometry(1.5, 15, 1.5);
            const cross = new THREE.BoxGeometry(24, 1.5, 1.5);
            const leftPost = new THREE.Mesh(post, mat); leftPost.castShadow = true; leftPost.position.set(-12, 7.5, 0);
            const rightPost = new THREE.Mesh(post, mat); rightPost.castShadow = true; rightPost.position.set(12, 7.5, 0);
            const crossbar = new THREE.Mesh(cross, mat); crossbar.castShadow = true; crossbar.position.set(0, 15, 0);
            group.add(leftPost, rightPost, crossbar);
            group.position.set(0, 0.75, z);
            group.rotation.y = z > 0 ? Math.PI : 0;
            return group;
        }
        const goalOffset = fieldHeight * 0.5 - 6;
        const goalNear = createGoal(-goalOffset);
        const goalFar = createGoal(goalOffset);
        scene.add(goalNear, goalFar);

        // 3D character builders (simple geometric approximations)
        function createLee() {
            const group = new THREE.Group();
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x7ff0ff, metalness: 0.1, roughness: 0.6 });
            const whiteMat = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 0.05, roughness: 0.8 });
            const skinMat = new THREE.MeshStandardMaterial({ color: 0xffe0bd, metalness: 0.0, roughness: 0.9 });
            const purpleMat = new THREE.MeshStandardMaterial({ color: 0x7a2f9c, metalness: 0.2, roughness: 0.5 });
            const glassMat = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 0.0, roughness: 0.15, transparent: true, opacity: 0.25 });

            // Torso
            const torso = new THREE.Mesh(new THREE.CapsuleGeometry(6, 10, 8, 16), bodyMat);
            torso.castShadow = true; torso.position.y = 18;
            group.add(torso);

            // Head
            const head = new THREE.Mesh(new THREE.SphereGeometry(4.2, 24, 16), skinMat);
            head.castShadow = true; head.position.set(0, 28.5, 0);
            group.add(head);

            // Helmet bubble
            const helmet = new THREE.Mesh(new THREE.SphereGeometry(6.8, 32, 24, 0, Math.PI), glassMat);
            helmet.position.set(0, 26.5, 0);
            group.add(helmet);

            // Shoulders and arms
            const shoulder = new THREE.Mesh(new THREE.SphereGeometry(3.2, 16, 12), whiteMat);
            const shoulderR = shoulder.clone();
            shoulder.position.set(-6.5, 23, 0);
            shoulderR.position.set(6.5, 23, 0);
            group.add(shoulder, shoulderR);

            const upperArmGeom = new THREE.CapsuleGeometry(2, 6, 8, 16);
            const foreArmGeom = new THREE.CapsuleGeometry(1.8, 6, 8, 16);
            const upperL = new THREE.Mesh(upperArmGeom, whiteMat); upperL.position.set(-9, 20, 0); upperL.rotation.z = 0.3; upperL.castShadow = true;
            const foreL = new THREE.Mesh(foreArmGeom, whiteMat); foreL.position.set(-12, 15, 1); foreL.rotation.z = 0.8; foreL.castShadow = true;
            const upperR = upperL.clone(); upperR.position.set(9, 20, 0); upperR.rotation.z = -0.3;
            const foreR = foreL.clone(); foreR.position.set(12, 15, -1); foreR.rotation.z = -0.8;
            group.add(upperL, foreL, upperR, foreR);

            // Legs
            const hip = new THREE.Mesh(new THREE.SphereGeometry(3, 16, 12), whiteMat); hip.position.set(0, 13, 0); group.add(hip);
            const thighGeom = new THREE.CapsuleGeometry(2.6, 8, 8, 16);
            const shinGeom = new THREE.CapsuleGeometry(2.2, 8, 8, 16);
            const thighL = new THREE.Mesh(thighGeom, whiteMat); thighL.position.set(-3.5, 10, 0); thighL.rotation.z = 0.15; thighL.castShadow = true;
            const shinL = new THREE.Mesh(shinGeom, whiteMat); shinL.position.set(-3.7, 4.5, 0.2); shinL.rotation.z = -0.05; shinL.castShadow = true;
            const thighR = thighL.clone(); thighR.position.set(3.5, 10, 0); thighR.rotation.z = -0.15;
            const shinR = shinL.clone(); shinR.position.set(3.7, 4.5, -0.2); shinR.rotation.z = 0.05;
            const bootGeom = new THREE.BoxGeometry(4.5, 2.2, 8);
            const bootL = new THREE.Mesh(bootGeom, purpleMat); bootL.position.set(-3.7, 2.0, 2.0); bootL.castShadow = true;
            const bootR = bootL.clone(); bootR.position.set(3.7, 2.0, 2.0);
            group.add(thighL, shinL, thighR, shinR, bootL, bootR);

            // Accent chest plate
            const chest = new THREE.Mesh(new THREE.TorusGeometry(6, 0.6, 12, 24, Math.PI), purpleMat);
            chest.rotation.x = Math.PI / 2; chest.position.set(0, 22.5, 3);
            group.add(chest);

            // Store limb references for animation
            group.userData = {
                thighL: thighL,
                thighR: thighR,
                shinL: shinL,
                shinR: shinR,
                upperL: upperL,
                upperR: upperR,
                foreL: foreL,
                foreR: foreR
            };

            group.scale.set(1.0, 1.0, 1.0);
            return group;
        }

        function createJack() {
            const group = new THREE.Group();
            const shirtMat = new THREE.MeshStandardMaterial({ color: 0xf7e27b, metalness: 0.0, roughness: 0.85 });
            const jeanMat = new THREE.MeshStandardMaterial({ color: 0x2b4c9a, metalness: 0.05, roughness: 0.9 });
            const skinMat = new THREE.MeshStandardMaterial({ color: 0xffd6b1, metalness: 0.0, roughness: 0.9 });
            const hatMat = new THREE.MeshStandardMaterial({ color: 0x8b4513, metalness: 0.2, roughness: 0.6 });
            const bootMat = new THREE.MeshStandardMaterial({ color: 0x6b3e1f, metalness: 0.2, roughness: 0.7 });

            // Torso
            const torso = new THREE.Mesh(new THREE.CapsuleGeometry(5.5, 10, 8, 16), shirtMat);
            torso.castShadow = true; torso.position.y = 18;
            group.add(torso);

            // Head
            const head = new THREE.Mesh(new THREE.SphereGeometry(4, 24, 16), skinMat);
            head.castShadow = true; head.position.set(0, 28, 0);
            group.add(head);

            // Hat (cowboy brim + crown)
            const brim = new THREE.Mesh(new THREE.TorusGeometry(6.5, 0.6, 8, 32), hatMat);
            brim.rotation.x = Math.PI / 2; brim.position.set(0, 31, 0);
            const crown = new THREE.Mesh(new THREE.CylinderGeometry(3.2, 3.5, 3.2, 16), hatMat);
            crown.position.set(0, 33, 0);
            group.add(brim, crown);

            // Arms
            const upperArmGeom = new THREE.CapsuleGeometry(2, 7, 8, 16);
            const foreArmGeom = new THREE.CapsuleGeometry(1.8, 6, 8, 16);
            const upperL = new THREE.Mesh(upperArmGeom, shirtMat); upperL.position.set(-7.5, 21, 0); upperL.rotation.z = 0.25; upperL.castShadow = true;
            const foreL = new THREE.Mesh(foreArmGeom, skinMat); foreL.position.set(-10, 16, 0.5); foreL.rotation.z = 0.8; foreL.castShadow = true;
            const upperR = upperL.clone(); upperR.position.set(7.5, 21, 0); upperR.rotation.z = -0.25;
            const foreR = foreL.clone(); foreR.position.set(10, 16, -0.5); foreR.rotation.z = -0.8;
            group.add(upperL, foreL, upperR, foreR);

            // Legs
            const thighGeom = new THREE.CapsuleGeometry(2.4, 9, 8, 16);
            const shinGeom = new THREE.CapsuleGeometry(2.1, 8, 8, 16);
            const thighL = new THREE.Mesh(thighGeom, jeanMat); thighL.position.set(-3, 10.5, 0); thighL.rotation.z = 0.1; thighL.castShadow = true;
            const shinL = new THREE.Mesh(shinGeom, jeanMat); shinL.position.set(-3.2, 5, 0.2); shinL.rotation.z = -0.05; shinL.castShadow = true;
            const thighR = thighL.clone(); thighR.position.set(3, 10.5, 0); thighR.rotation.z = -0.1;
            const shinR = shinL.clone(); shinR.position.set(3.2, 5, -0.2); shinR.rotation.z = 0.05;
            const bootGeom = new THREE.BoxGeometry(4.2, 2.1, 7.5);
            const bootL = new THREE.Mesh(bootGeom, bootMat); bootL.position.set(-3.2, 2.1, 2.0); bootL.castShadow = true;
            const bootR = bootL.clone(); bootR.position.set(3.2, 2.1, 2.0);
            group.add(thighL, shinL, thighR, shinR, bootL, bootR);

            // Store limb references for animation
            group.userData = {
                thighL: thighL,
                thighR: thighR,
                shinL: shinL,
                shinR: shinR,
                upperL: upperL,
                upperR: upperR,
                foreL: foreL,
                foreR: foreR
            };

            group.scale.set(1.0, 1.0, 1.0);
            return group;
        }

        const Lee = createLee();
        Lee.position.set(0, 0, 50);
        Lee.rotation.y = Math.PI; // Face towards negative Z (towards the other goal)
        scene.add(Lee);

        const Jack = createJack();
        Jack.position.set(0, 0, -50);
        Jack.rotation.y = 0; // Face towards positive Z
        scene.add(Jack);

        // Football
        const footballGeom = new THREE.SphereGeometry(2, 32, 16);
        const footballMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
        const football = new THREE.Mesh(footballGeom, footballMat);
        football.position.set(0, 1, 40);
        football.castShadow = true;
        scene.add(football);

        // Ball physics variables
        let ballY = 1;
        let ballVy = 0;
        let initialVy;
        const gravity = -0.02;
        const damping = 0.85;
        const maxHeight = 210;

        // Animation variables
        let t = 0;
        let progress = 0;
        let kicked = false;
        let goalScored = false;
        let prevProgress = 0;
        const movementDistance = 100; // Total distance for one cycle
        const stepsPerCycle = 8; // Number of steps in one cycle

        initialVy = Math.random() * 2.4 + 0.5;
        ballVy = initialVy;

        function animate() {
            requestAnimationFrame(animate);
            t += 0.01;
            progress = (t * 0.005) % 1;

            if (progress < prevProgress) {
                kicked = false;
                goalScored = false;
                Lee.position.z = 50;
                football.position.set(0, 1, 40);
                ballY = 1;
                initialVy = Math.random() * 2.4 + 0.5;
                ballVy = initialVy;
            }
            prevProgress = progress;

            // Lee forward movement towards the other goal (negative Z)
            const currentZ = 50 - progress * movementDistance;
            Lee.position.z = currentZ;

            // Ball follows until kick
            if (progress < 0.8) {
                football.position.z = 40 - progress * movementDistance * 0.8; // Slightly behind

                // Physics simulation for bouncing
                ballY += ballVy;
                ballVy += gravity;
                if (ballY <= 1) {
                    ballY = 1;
                    ballVy = -ballVy * damping;
                } else if (ballY > maxHeight) {
                    ballY = maxHeight;
                    ballVy = 0;
                }
                football.position.y = ballY;
                kicked = false;
            } else if (!kicked) {
                // Kick: accelerate ball
                const kickSpeed = -20; // Negative to go towards negative Z
                football.position.z += kickSpeed;
                football.position.y += 2; // Arc up
                kicked = true;
            }

            if (kicked && progress > 0.85) {
                // Ball trajectory after kick (simple parabolic)
                const kickProgress = (progress - 0.8) / 0.2;
                football.position.z = 40 - 0.8 * movementDistance + kickProgress * -30;
                let kickY = 1 + 3 * kickProgress - 2 * kickProgress * kickProgress; // Parabola
                if (kickY > maxHeight) kickY = maxHeight;
                football.position.y = kickY;
                football.position.x = Math.sin(kickProgress * Math.PI) * 3; // Curve
            }

            if (progress > 0.95 && !goalScored) {
                // Goal scored, ball in net (other goal)
                football.position.z = -goalOffset + 3;
                football.position.x = Math.random() * 10 - 5;
                football.position.y = 1;
                goalScored = true;
            }

            // Walking animation synced to distance traveled
            const walkProgress = progress * stepsPerCycle * Math.PI * 2; // Full cycles for steps
            const legSwing = Math.sin(walkProgress) * 0.6;
            const armSwing = Math.sin(walkProgress + Math.PI) * 0.4;

            // Lee walking
            Lee.userData.thighL.rotation.x = legSwing;
            Lee.userData.thighR.rotation.x = -legSwing;
            Lee.userData.shinL.rotation.x = Math.max(0, legSwing) * 0.8; // Bend knee when lifting
            Lee.userData.shinR.rotation.x = Math.max(0, -legSwing) * 0.8;
            Lee.userData.upperL.rotation.x = armSwing;
            Lee.userData.upperR.rotation.x = -armSwing;
            Lee.userData.foreL.rotation.x = armSwing * 0.6;
            Lee.userData.foreR.rotation.x = -armSwing * 0.6;

            // Somersault for Jack
            const JackPhase = t * 4 % (2 * Math.PI);
            Jack.position.y = Math.max(0, Math.sin(JackPhase) * 75);
            const JackMod = JackPhase % (2 * Math.PI);
            if (Math.sin(JackPhase) > 0) {
                const airPhase = JackMod;
                Jack.rotation.x = - (airPhase / Math.PI) * 2 * Math.PI;
            } else {
                Jack.rotation.x = 0;
            }

            // Somersault for Lee
            const LeePhase = (t * 4 + Math.PI) % (2 * Math.PI);
            Lee.position.y = Math.max(0, Math.sin(LeePhase) * 75);
            const LeeMod = LeePhase % (2 * Math.PI);
            if (Math.sin(LeePhase) > 0) {
                const airPhase = LeeMod;
                Lee.rotation.x = - (airPhase / Math.PI) * 2 * Math.PI;
            } else {
                Lee.rotation.x = 0;
            }

            // Ball rolling rotation (tied to distance)
            if (progress < 0.8 || kicked) {
                const distanceTraveled = Math.abs(football.position.z - 40);
                const radius = 2;
                const rotationAmount = distanceTraveled / radius;
                football.rotation.x = rotationAmount; // Roll forward (adjusted for direction)
                football.rotation.z = rotationAmount * 0.5; // Slight side roll
            }

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // Resize handling
        function onResize() {
            const w = container.clientWidth;
            const h = container.clientHeight;
            renderer.setSize(w, h);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
        }
        window.addEventListener('resize', onResize);
    </script>
</body>
