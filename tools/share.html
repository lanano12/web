<!doctype html>
<html lang="en-GB">
  <head>

    <style>
      @font-face {
        font-family: Sora;

      @font-face {
        font-family: Mono;
        src: url(/fonts/jetbrains-mono.woff2);
      }
      * {

      body {
        width: 1200px;

        height: 34px;

      h1 {

        font-size: 64px;
        font-weight: 450;
        letter-spacing: -4px;
        line-height: 1.12;
        margin: 0;
      }
      em {
        color: #b5ff68;
        font-style: normal;
      }
      p {
        position: absolute;
        left: 53px;
        bottom: 55px;
        font:
          12px Mono,
          monospace;
        color: #a4b2a9;
        letter-spacing: 0.5px;
      }
      object {
        position: absolute;
        width: 560px;
        height: 500px;
        right: 14px;
        top: 65px;
      }
      footer {
        position: absolute;
        right: 50px;
        bottom: 55px;
        font:
          12px Mono,
          monospace;
        color: #b5ff68;
      }
      .line {
        position: absolute;

      data="/tools/device.svg"
      type="image/svg+xml"
      aria-label="Illustrative embedded device"
    ></object>
    <div class="line"></div>
    <p>EMBEDDED ENGINEERING / PRODUCT SECURITY / EU CRA</p>
