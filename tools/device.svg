  <title id="device-title">Exploded view of a connected embedded device</title>
  <desc id="device-desc">
    An illustrative circuit board, firmware plane, trust boundary and release evidence. Use the
    layer controls to explore each part.
  </desc>
  <defs>
    <linearGradient id="board-face" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#233c34" />
      <stop offset=".5" stop-color="#122822" />
      <stop offset="1" stop-color="#0a1714" />
    </linearGradient>
    <linearGradient id="chip-face" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#34483e" />
      <stop offset="1" stop-color="#101c17" />
    </linearGradient>
    <linearGradient id="plane-face" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#b5ff68" stop-opacity=".13" />
      <stop offset="1" stop-color="#6bd8ca" stop-opacity=".02" />
    </linearGradient>
    <radialGradient id="ground-glow">
      <stop stop-color="#a4ef70" stop-opacity=".16" />
      <stop offset="1" stop-color="#a4ef70" stop-opacity="0" />
    </radialGradient>
